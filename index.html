<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simple interest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h1>SIMPLE INTEREST CALCULATOR</h1>
            </div>
        </div>

         <div class="row">
            <div class="col-md-12">
                <form>
                    <div class="form-group">
                        <label class="form-group">Principal</label>
                        <input class="form-control" type="text" id="Principal">
                    </div>


                    <div class="form-group">
                        <label class="form-group">Years</label>
                        <input class="form-control" type="text" id="Years">
                    </div>


                    <div class="form-group">
                        <label class="form-group">Rate Of Interest</label>
                        <input class="form-control" type="text" id="rate">
                    </div>
                    <button class="btn btn-primary" type="button" onclick="Calculate">Calculate</button>
                </form>
            </div>
         </div>


         <div class="row">
            <div class="col-md-12">
                <h1 id="res">$</h1>
            </div>
         </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
